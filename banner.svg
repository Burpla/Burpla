<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" role="img" aria-labelledby="titulo">
  <title id="titulo">Santino, alias Burpla</title>

  <defs>
    <linearGradient id="fondo" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#0C1424"/>
      <stop offset="0.5" stop-color="#102B36"/>
      <stop offset="1" stop-color="#0C1424"/>
    </linearGradient>

    <radialGradient id="centro" cx="35%" cy="30%" r="80%">
      <stop stop-color="#208D91"/>
      <stop offset="0.65" stop-color="#10505D"/>
      <stop offset="1" stop-color="#0E303F"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="998" height="178" rx="26"
        fill="url(#fondo)" stroke="#25424F"/>

  <!-- Trazas de circuito a ambos lados del círculo -->
  <g fill="none" stroke="#327681" stroke-width="1.5">
    <path d="M342 100h36l12-12h47"/>
    <path d="M563 88h47l12-12h36"/>
  </g>
  <g fill="#72E0DB">
    <circle cx="342" cy="100" r="2.5"/>
    <circle cx="658" cy="76" r="2.5"/>
  </g>

  <!-- Círculo central con dos arcos de luz -->
  <path fill="url(#centro)" stroke="#31878B" stroke-width="1"
      d="M 500 37
         C 529 37 553 61 553 90
         C 553 119 529 143 500 143
         C 471 143 447 119 447 90
         C 447 61 471 37 500 37 Z">
  <animate
    attributeName="d"
    dur="4s"
    repeatCount="indefinite"
    calcMode="spline"
    keyTimes="0;0.33;0.66;1"
    keySplines=".45 0 .55 1; .45 0 .55 1; .45 0 .55 1"
    values="
      M 500 37 C 529 37 553 61 553 90 C 553 119 529 143 500 143 C 471 143 447 119 447 90 C 447 61 471 37 500 37 Z;
      M 510 36 C 538 36 548 64 551 86 C 555 114 529 135 494 143 C 468 149 447 125 447 99 C 447 73 482 36 510 36 Z;
      M 490 39 C 516 34 547 48 555 78 C 562 104 540 137 512 143 C 485 149 459 133 449 106 C 438 77 463 44 490 39 Z;
      M 500 37 C 529 37 553 61 553 90 C 553 119 529 143 500 143 C 471 143 447 119 447 90 C 447 61 471 37 500 37 Z"
  />
</path>
  <g class="orbita">
  <circle cx="500" cy="90" r="61"
          fill="none" stroke="#64D8D3" stroke-width="2"
          stroke-dasharray="65 127"
          transform="rotate(-55 500 90)" />
</g>

<style>
  .orbita {
    transform-origin: 500px 90px;
    animation: girar 16s linear infinite;
  }

  @keyframes girar {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .orbita { animation: none; }
  }
</style>

  <text x="202" y="110" text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif" font-size="60"
        font-weight="700" fill="#F1F6FA">Santino</text>

  <text x="802" y="102" text-anchor="middle"
        font-family="Consolas, monospace" font-size="35"
        fill="#8AE7DF">⟨ Burpla ⟩</text>
</svg>
